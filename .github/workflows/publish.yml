name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    environment: publish # must match the crates.io trusted publisher config
    permissions:
      contents: read
      id-token: write # OIDC token exchange with crates.io
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Check crate version matches tag
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "$version" != "${GITHUB_REF_NAME#v}" ]; then
            echo "Cargo.toml version $version != tag ${GITHUB_REF_NAME}"
            exit 1
          fi
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish
